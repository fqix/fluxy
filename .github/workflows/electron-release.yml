name: Electron Release
on:
  push:
    tags: ['electron-v*']
permissions:
  contents: write
concurrency:
  group: electron-release
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: windows-11-arm
            platform: win32
            arch: arm64
    name: Build ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    env:
      FLUXY_BUILD_PLATFORM: ${{ matrix.platform }}
      FLUXY_BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            tools/sing-box/go.sum
            tools/helper/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate native build architecture
        run: node -e 'if(process.platform !== process.env.FLUXY_BUILD_PLATFORM || process.arch !== process.env.FLUXY_BUILD_ARCH) throw Error("Runner architecture differs from release target")'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if(process.env.RELEASE_TAG !== "electron-v"+require("./package.json").version) throw Error("Tag and package version must match")'
      - name: Select macOS signing mode
        id: mac-signing
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node <<'NODE'
          const keys = ['CSC_LINK', 'CSC_KEY_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID']
          const configured = keys.filter(key => process.env[key])
          if (configured.length && configured.length !== keys.length) throw Error('Incomplete macOS signing configuration')
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `mode=${configured.length ? 'developer-id' : 'adhoc'}\n`)
          NODE
      - name: Test build script encoding
        run: python -m unittest discover -s tools/sing-box -p "test_*.py"
      - run: npm ci
      - name: Install RPM build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm test
      - run: npm run build
      - run: npx playwright test
        if: runner.os == 'macOS'
      - run: powershell -NoProfile -File tools/install/test-windows.ps1
        if: runner.os == 'Windows'
      - name: Build signed and notarized macOS artifacts
        if: runner.os == 'macOS' && steps.mac-signing.outputs.mode == 'developer-id'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never -c.forceCodeSigning=true -c.mac.notarize=true
      - name: Build ad-hoc signed macOS artifacts
        if: runner.os == 'macOS' && steps.mac-signing.outputs.mode == 'adhoc'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false -c.mac.preAutoEntitlements=false
      - name: Build Linux deb and rpm
        if: runner.os == 'Linux'
        run: npx electron-builder --linux deb rpm --${{ matrix.arch }} --publish never
      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --${{ matrix.arch }} --publish never
      - name: Prepare installer aliases and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/publish-electron-release.mjs --prepare
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/Fluxy-*
            dist/latest*.yml
            dist/release-plan.json
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          pattern: installers-*
      - name: Publish versioned release and update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node tools/publish-electron-release.mjs --publish release-artifacts
