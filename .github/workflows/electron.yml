name: Electron Desktop
on:
  push:
    branches: ['**']
    paths:
      [
        'src/**',
        'tests/**',
        'resources/**',
        'third_party/patches/sing-box/**',
        'tools/helper/**',
        'scripts/**',
        'install.sh',
        'install.ps1',
        'third_party/sing-box',
        'package*.json',
        '*config.ts',
        '.github/workflows/electron.yml'
      ]
  pull_request:
    paths:
      [
        'src/**',
        'tests/**',
        'resources/**',
        'third_party/patches/sing-box/**',
        'tools/helper/**',
        'scripts/**',
        'install.sh',
        'install.ps1',
        'third_party/sing-box',
        'package*.json',
        '*config.ts',
        '.github/workflows/electron.yml'
      ]
concurrency:
  group: electron-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache-dependency-path: |
            third_party/sing-box/go.sum
            tools/helper/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install RPM build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npx playwright install-deps chromium
        if: runner.os == 'Linux'
      - run: go test -race ./...
        working-directory: tools/helper
      - run: go vet ./...
        working-directory: tools/helper
      - run: npm test
      - run: npm run test:protocol
        env:
          FLUXY_CORE_RACE: '1'
          GORACE: halt_on_error=1
      - run: npm run sing-box:test
      - run: npm run build
      - name: Playwright desktop tests (macOS / Windows)
        run: npx playwright test
        if: runner.os != 'Linux'
      - name: Playwright desktop tests (Linux / Xvfb)
        run: xvfb-run --auto-servernum npx playwright test
        if: runner.os == 'Linux'
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Linux deb and rpm packaging
        if: runner.os == 'Linux'
        run: npx electron-builder --linux deb rpm --publish never
      - uses: actions/upload-artifact@v7
        if: ${{ always() && hashFiles('test-results/**') != '' }}
        with:
          name: electron-test-results-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
